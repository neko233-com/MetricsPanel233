name: metricspanel233-tests
services:
  suite:
    build:
      context: .
      target: integration
      args:
        GOPROXY: ${METRICSPANEL_GOPROXY:-https://proxy.golang.org,direct}
        TEST_CLICKHOUSE_IMAGE: ${METRICSPANEL_TEST_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8-alpine}
        TEST_EXPORTER_IMAGE: ${METRICSPANEL_TEST_EXPORTER_IMAGE:-prom/mysqld-exporter:v0.20.0}
    image: metricspanel233-test:local
    environment:
      METRICSPANEL_TOKEN: metricspanel-integration-test-token
      METRICSPANEL_ALLOW_UNSIGNED_PLUGINS: metricspanel-sdk-app
    ports: ["127.0.0.1::7333", "127.0.0.1::7334", "127.0.0.1::8123"]
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    volumes: ["suite:/data"]
    extra_hosts: ["mysql-exporter:127.0.0.1"]
    stop_grace_period: 30s
volumes:
  suite:
