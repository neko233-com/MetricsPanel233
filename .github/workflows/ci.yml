name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run test:unit && npm run build
        working-directory: web
      - run: go vet ./... && go test -race ./... -count=1
      - run: mkdir -p bin && go build -tags webui -o bin/metricspanel ./cmd/metricspanel
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METRICSPANEL_TEST_CLICKHOUSE_IMAGE: mirror.gcr.io/clickhouse/clickhouse-server:26.8-alpine@sha256:11f32c76f576b5fd993cbcfffe4349caac6a67c2e58bb846f4da421889573a69
      METRICSPANEL_TEST_EXPORTER_IMAGE: mirror.gcr.io/prom/mysqld-exporter:v0.20.0@sha256:abed8dac117b4ae5b70757f988e44795935b9a72c3b58d720c67ba688f8cb79e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - name: Use public Docker Hub cache
        shell: bash
        run: |
          mirror_config=$(mktemp)
          trap 'rm -f "$mirror_config" "$mirror_config.updated"' EXIT
          if [ -f /etc/docker/daemon.json ]; then
            sudo cat /etc/docker/daemon.json | tee "$mirror_config" > /dev/null
          else
            printf '{}\n' > "$mirror_config"
          fi
          jq '."registry-mirrors" = ((."registry-mirrors" // []) + ["https://mirror.gcr.io"] | unique)' "$mirror_config" > "$mirror_config.updated"
          sudo install -m 0644 "$mirror_config.updated" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - run: go test -tags=integration ./tests/integration -count=2 -v -timeout=25m
