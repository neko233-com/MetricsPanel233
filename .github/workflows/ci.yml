name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: go vet ./... && go test -race ./... -count=1
      - run: mkdir -p bin && go build -tags webui -o bin/metricspanel ./cmd/metricspanel
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - name: Use public Docker Hub cache
        shell: bash
        run: |
          mirror_config=$(mktemp)
          trap 'rm -f "$mirror_config" "$mirror_config.updated"' EXIT
          if [ -f /etc/docker/daemon.json ]; then
            sudo cat /etc/docker/daemon.json > "$mirror_config"
          else
            printf '{}\n' > "$mirror_config"
          fi
          jq '."registry-mirrors" = ((."registry-mirrors" // []) + ["https://mirror.gcr.io"] | unique)' "$mirror_config" > "$mirror_config.updated"
          sudo install -m 0644 "$mirror_config.updated" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - run: go test -tags=integration ./tests/integration -count=2 -v -timeout=25m
