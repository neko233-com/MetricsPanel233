name: Validate aggregate
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aggregate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
          cache-dependency-path: metrics233-server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: metrics233-server/web/package-lock.json
      - name: Check public files, index, history and pinned submodules
        run: go run ./tools/check-public/main.go --root . --history --require-submodules --allow-synthetic-test-ips
      - run: npm ci && npm run test:unit && npm run build
        working-directory: metrics233-server/web
      - run: mkdir -p bin && go build -tags webui -trimpath -o bin/metricspanel ./cmd/metricspanel
        working-directory: metrics233-server
      - run: go vet ./... && go test -race ./... -count=1
        working-directory: metrics233-lib-go
      - name: SDK against the exact pinned server binary
        run: METRICS233_TEST_BINARY="$GITHUB_WORKSPACE/metrics233-server/bin/metricspanel" go test -run '^TestServerBinaryIntegration$' -count=1 -v
        working-directory: metrics233-lib-go
